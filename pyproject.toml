[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chaoqian"
version = "0.1.0"
description = "Deterministic Chinese calendrical divination engine (Liu Yao, Ba Zi, Qi Men, almanac) with a guarded, pluggable LLM copy layer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["lunar-python>=1.4.8", "tzdata"]

[project.optional-dependencies]
llm = ["anthropic"]
test = ["pytest"]

[tool.setuptools]
packages = ["chaoqian"]

[tool.setuptools.package-data]
chaoqian = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
